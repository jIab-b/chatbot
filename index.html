<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client-side AI Chatbot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="container">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <button id="newChatBtn">+</button>
      </div>
      <ul id="chatList"></ul>
    </aside>
    
    <!-- Main Chat Area -->
    <main id="chatArea">
      <div id="chatHeader"></div>
      <div id="chatHistory"></div>
      <form id="messageForm" autocomplete="off">
        <input id="messageInput" autocomplete="off" placeholder="Send a message..." required />
        <button type="submit">➤</button>
        <button type="button" id="forkBtn" title="Fork">⎇</button>
      </form>
    </main>
  </div>
  <script src="chatbot.js"></script>
</body>
</html>
